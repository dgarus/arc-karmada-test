# ==============================================================================
# 核心分发策略 (PropagationPolicies)
# ==============================================================================

# 1. 基础鉴权 Secret 全局分发策略
# 确保包含 GitHub Token / App 密钥的 Secret 同步至所有承载 Runner 的子集群
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-secret-propagation
  namespace: arc-runners
spec:
  resourceSelectors:
  - apiVersion: v1
    kind: Secret
    name: arc-github-secret
  placement:
    clusterAffinity:
      clusterNames:
      - member-1
      - member-2
---
# 2. 单一 Listener 及其依赖凭证定向分发策略
# Listener Pod/ServiceAccount выбираются по стабильным ARC labels,
# config Secret — по явно заданному label, без привязки к generated hash.
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-listener-propagation
  namespace: arc-systems
spec:
  resourceSelectors:
  - apiVersion: v1
    kind: Pod
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: runner-scale-set-listener
        actions.github.com/scale-set-name: karmada-runner
  - apiVersion: v1
    kind: Secret
    name: karmada-token
  - apiVersion: v1
    kind: Secret
    labelSelector:
      matchLabels:
        arc-karmada-test/listener-config: "true"
  - apiVersion: v1
    kind: ServiceAccount
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: runner-scale-set-listener
        actions.github.com/scale-set-name: karmada-runner
  placement:
    clusterAffinity:
      clusterNames:
      - member-1
---
# 3. 核心机制 ③：Runner Pod 跨集群分摊调度与 JIT Secret 依赖自动穿透策略
# - propagateDeps: true: Karmada 自动解析 Runner Pod 环境变量中通过 secretKeyRef
#   引用的瞬时一次性 JIT 凭据 Secret，并与 Pod 强绑定原子下发至同一集群；
# - replicaScheduling: Divided / Weighted: Karmada 调度器将并发到来的任务分摊至各成员集群。
apiVersion: policy.karmada.io/v1alpha1
kind: PropagationPolicy
metadata:
  name: arc-runner-pod-propagation
  namespace: arc-runners
spec:
  resourceSelectors:
  - apiVersion: v1
    kind: Pod
  propagateDeps: true
  placement:
    clusterAffinity:
      clusterNames:
      - member-1
      - member-2
    replicaScheduling:
      replicaSchedulingType: Divided
      replicaDivisionPreference: Weighted
